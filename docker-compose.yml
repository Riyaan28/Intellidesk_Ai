version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: intellidesk-backend
    environment:
      DATABASE_URL: sqlite:///./data/intellidesk.db
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SECRET_KEY: docker-secret-key-change-in-production
      PYTHONUNBUFFERED: 1
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
    ports:
      - "8000:8000"
    networks:
      - intellidesk-network
    volumes:
      - backend_data:/app/backend/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: intellidesk-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - intellidesk-network
    environment:
      VITE_API_URL: http://localhost:8000

volumes:
  backend_data:

networks:
  intellidesk-network:
    driver: bridge
